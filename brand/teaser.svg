<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0E1830"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A66FF"/>
      <stop offset="1" stop-color="#0038CC"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#8A97AF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <circle cx="1080" cy="90" r="240" fill="#0052FF" opacity="0.10"/>
  <circle cx="100" cy="620" r="200" fill="#0052FF" opacity="0.07"/>

  <!-- centered mark -->
  <g transform="translate(524,120) scale(0.3)">
    <rect width="512" height="512" rx="112" fill="url(#mark)"/>
    <rect x="132" y="150" width="34" height="228" rx="17" fill="#fff"/>
    <rect x="346" y="150" width="34" height="228" rx="17" fill="#fff"/>
    <rect x="132" y="150" width="248" height="34" rx="17" fill="#fff"/>
    <circle cx="256" cy="330" r="52" fill="#fff"/>
    <circle cx="256" cy="330" r="34" fill="#0043E6"/>
    <circle cx="256" cy="330" r="14" fill="#fff"/>
  </g>

  <text x="600" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="700" fill="#E8EDF7" text-anchor="middle" letter-spacing="-1">AgentToll</text>
  <text x="600" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="30" fill="#8A97AF" text-anchor="middle">Pay-per-call APIs for AI agents — on Base</text>

  <rect x="490" y="470" width="220" height="56" rx="28" fill="#0052FF"/>
