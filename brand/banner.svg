<svg viewBox="0 0 1500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0E1830"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A66FF"/>
      <stop offset="1" stop-color="#0038CC"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#8A97AF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1500" height="500" fill="url(#bg)"/>
  <rect width="1500" height="500" fill="url(#grid)"/>
  <!-- glow accent -->
  <circle cx="1350" cy="80" r="260" fill="#0052FF" opacity="0.10"/>
  <circle cx="120" cy="470" r="200" fill="#0052FF" opacity="0.07"/>

  <!-- logo mark -->
  <g transform="translate(120,140) scale(0.43)">
    <rect width="512" height="512" rx="112" fill="url(#mark)"/>
    <rect x="132" y="150" width="34" height="228" rx="17" fill="#fff"/>
    <rect x="346" y="150" width="34" height="228" rx="17" fill="#fff"/>
    <rect x="132" y="150" width="248" height="34" rx="17" fill="#fff"/>
    <circle cx="256" cy="330" r="52" fill="#fff"/>
    <circle cx="256" cy="330" r="34" fill="#0043E6"/>
    <circle cx="256" cy="330" r="14" fill="#fff"/>
  </g>

  <!-- wordmark + tagline -->
  <text x="390" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="86" font-weight="700" fill="#E8EDF7" letter-spacing="-2">AgentToll</text>
  <text x="394" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#8A97AF">Pay-per-call APIs for AI agents</text>
  <text x="394" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#8A97AF">USDC micropayments, settled on Base via x402</text>

  <!-- pills -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="24">
    <rect x="394" y="386" width="176" height="46" rx="23" fill="none" stroke="#0052FF" stroke-width="2"/>
    <text x="482" y="417" fill="#3D7BFF" text-anchor="middle">Built on Base</text>
    <rect x="586" y="386" width="200" height="46" rx="23" fill="none" stroke="#8A97AF" stroke-opacity="0.35" stroke-width="2"/>
    <text x="686" y="417" fill="#8A97AF" text-anchor="middle">x402 protocol</text>
    <rect x="802" y="386" width="230" height="46" rx="23" fill="none" stroke="#8A97AF" stroke-opacity="0.35" stroke-width="2"/>
    <text x="917" y="417" fill="#8A97AF" text-anchor="middle">Open source · MIT</text>
  </g>
</svg>
