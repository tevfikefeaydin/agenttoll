name: Publish MCP to npm

# Push a tag like mcp-v0.4.0 (after bumping mcp/package.json) and the package
# ships itself. Requires the NPM repository secret (npm automation token).
on:
  push:
    tags: ["mcp-v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance attestation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm ci --prefix mcp
      - name: Check release tag and generated package metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "const p=require('./mcp/package.json'); if(process.env.RELEASE_TAG !== 'mcp-v'+p.version) throw new Error('Tag and package version differ')"
          npm run check:generated
      - run: npm test
      - run: npm run typecheck
      - run: npm run build --prefix mcp
      - run: npm run smoke:mcp
      - name: Verify npm auth
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM }}
      - run: npm publish --access public
        working-directory: mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM }}
