name: Publish verified MCP to official Registry

# This workflow never publishes npm. It is called only after the npm release
# verification job succeeds, or manually to retry Registry discovery alone.
on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing release tag whose npm package has already been published
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing mcp-v<version> tag; npm will only be read and tested
        required: true
        type: string

concurrency:
  group: mcp-registry-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  registry:
    if: github.repository == 'tevfikefeaydin/agenttoll'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      NPM_CONFIG_PREFER_ONLINE: 'true'
    steps:
      - name: Validate release tag before checkout
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^mcp-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected an existing mcp-v<version> release tag'
            exit 1
          fi
      - name: Check out the reviewed workflow helper revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Preserve read-only wait helper for older release tags
        run: cp scripts/mcp-package-wait.mjs "$RUNNER_TEMP/mcp-package-wait.mjs"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify tag metadata and independently installed public npm package
        shell: bash
        run: |
          VERSION=$(node -p "require('./mcp/package.json').version")
          test "$RELEASE_TAG" = "mcp-v$VERSION"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          node "$RUNNER_TEMP/mcp-package-wait.mjs" --version "$VERSION"
          npm run smoke:mcp -- --registry-version "$VERSION" --artifact-dir "$RUNNER_TEMP/mcp-registry-consumer"
      - name: Publish official Registry record with short-lived GitHub OIDC
        run: node scripts/mcp-registry-publish.mjs --evidence "$RUNNER_TEMP/mcp-registry-consumer" --output "$RUNNER_TEMP/mcp-registry-verification.json"
      - name: Retain verified public package and exact Registry result
        uses: actions/upload-artifact@v4
        with:
          name: mcp-registry-${{ inputs.release_tag }}
          path: |
            ${{ runner.temp }}/mcp-registry-consumer/verification.json
            ${{ runner.temp }}/mcp-registry-verification.json
          if-no-files-found: error
