name: Check public source for secrets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified scanner
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --max-time 120 --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --status
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan reachable history without publishing findings
        shell: bash
        run: |
          set -euo pipefail
          if ! "$RUNNER_TEMP/gitleaks" git . --log-opts='--all' \
            --config=.gitleaks.toml --gitleaks-ignore-path=.gitleaksignore \
            --ignore-gitleaks-allow --redact=100 --no-banner --log-level=error \
            --report-format=json --report-path="$RUNNER_TEMP/secret-scan.json" \
            >"$RUNNER_TEMP/secret-scan.log" 2>&1; then
            echo '::error::Secret scan failed. Repeat the scan privately; do not post findings or credentials in public logs or issues.'
            exit 1
          fi
          echo 'Secret scan passed.'
      # Findings and scan logs deliberately have no upload-artifact step.
